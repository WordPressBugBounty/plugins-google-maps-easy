<?xml version="1.0" encoding="UTF-8"?>
<!--
  The layers of the Overview hero map: the delivery zone, the radius, the heat, the route, the pins and the labels.
  The streets are img/map-city.svg under this picture: both have the box of that city, so they use the same
  coordinates; the hero shows the part from 180/90, 360 x 360 (css/admin.overview.css). The route runs along the
  streets, the zone follows the streets around its blocks.
-->
<svg viewBox="-240 -40 1200 640" width="1200" height="640" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<defs>
<radialGradient id="gmpHeat"><stop offset="0" stop-color="#e53935" stop-opacity=".9"/><stop offset=".3" stop-color="#fb8c00" stop-opacity=".75"/><stop offset=".6" stop-color="#fdd835" stop-opacity=".5"/><stop offset=".85" stop-color="#7cb342" stop-opacity=".22"/><stop offset="1" stop-color="#7cb342" stop-opacity="0"/></radialGradient>
<filter id="gmpPinShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#000" flood-opacity=".3"/></filter>
<path id="gmpPin" d="M0 0C-3-6-11-12.5-11-21A11 11 0 1 1 11-21C11-12.5 3-6 0 0Z"/>
<path id="gmpHarborRd" d="M360 470C424 396 480 373 550 342"/>
</defs>
<path d="M425 150H555V305H490V230H425Z" fill="#4285f4" fill-opacity=".14" stroke="#4285f4" stroke-width="2" stroke-linejoin="round"/>
<circle cx="235" cy="185" r="38" fill="#19a79e" fill-opacity=".14" stroke="#19a79e" stroke-width="1.8"/>
<g style="mix-blend-mode:multiply"><circle cx="412" cy="372" r="44" fill="url(#gmpHeat)"/><circle cx="446" cy="388" r="32" fill="url(#gmpHeat)"/><circle cx="398" cy="400" r="26" fill="url(#gmpHeat)"/><circle cx="434" cy="346" r="26" fill="url(#gmpHeat)"/><circle cx="420" cy="380" r="16" fill="url(#gmpHeat)"/></g>
<g font-family="Roboto, Arial, sans-serif" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="2.5" stroke-linejoin="round">
<text x="458" y="308" font-size="7.5" fill="#6d5a1f" text-anchor="middle">Market St</text>
<text transform="translate(363 440) rotate(-90)" font-size="7.5" fill="#6d5a1f">5th Ave</text>
<text font-size="6.5" fill="#70757a"><textPath href="#gmpHarborRd" xlink:href="#gmpHarborRd" startOffset="54%">Harbor Rd</textPath></text>
<text x="238" y="271" font-size="7" fill="#2e7d32" text-anchor="middle">Riverside Park</text>
<text x="516" y="436" font-size="7" font-style="italic" fill="#3f7bb5" text-anchor="middle">Harbor Bay</text>
<text x="522" y="270" font-size="6.5" font-weight="800" fill="#1a56c9" text-anchor="middle" letter-spacing=".4">DELIVERY</text>
<text x="522" y="279" font-size="6.5" font-weight="800" fill="#1a56c9" text-anchor="middle" letter-spacing=".4">ZONE</text>
</g>
<path d="M265 410H298V352H360V314" fill="none" stroke="#1967d2" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M265 410H298V352H360V314" fill="none" stroke="#4285f4" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="265" cy="410" r="13" fill="#4285f4" fill-opacity=".18"/>
<circle cx="265" cy="410" r="6" fill="#4285f4" stroke="#fff" stroke-width="2.5" filter="url(#gmpPinShadow)"/>
<g transform="translate(425 380)" filter="url(#gmpPinShadow)"><circle r="15" fill="#4285f4" fill-opacity=".25"/><circle r="11" fill="#4285f4" stroke="#fff" stroke-width="2"/><text y="3.5" font-family="Roboto, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">8</text></g>
<g transform="translate(235 185)" filter="url(#gmpPinShadow)"><use href="#gmpPin" xlink:href="#gmpPin" fill="#19a79e" stroke="#0e7a73" stroke-width="1"/><text y="-17.5" font-family="Roboto, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text></g>
<g transform="translate(490 205)" filter="url(#gmpPinShadow)"><use href="#gmpPin" xlink:href="#gmpPin" fill="#7259ef" stroke="#4f3bc2" stroke-width="1"/><text y="-17.5" font-family="Roboto, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text></g>
<g transform="translate(452 160) scale(.72)" filter="url(#gmpPinShadow)"><use href="#gmpPin" xlink:href="#gmpPin" fill="#ea4335" stroke="#b31412" stroke-width="1.2"/><circle cy="-21" r="4" fill="#b31412"/></g>
<g transform="translate(246 352)" filter="url(#gmpPinShadow)"><use href="#gmpPin" xlink:href="#gmpPin" fill="#f29900" stroke="#c26401" stroke-width="1"/><text y="-17.5" font-family="Roboto, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text></g>
<g transform="translate(360 305) scale(1.25)" filter="url(#gmpPinShadow)"><use href="#gmpPin" xlink:href="#gmpPin" fill="#ea4335" stroke="#b31412" stroke-width="1"/><text y="-17.5" font-family="Roboto, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text></g>
</svg>
